    <script>
      // Early safety handler for benign Vite WebSocket closures in preview iframe
      window.addEventListener('unhandledrejection', function (event) {
        var str = event && event.reason ? String(event.reason.message || event.reason) : '';
        if (
          str.indexOf('WebSocket') !== -1 ||
          str.indexOf('websocket') !== -1 ||
          str.indexOf('closed without opened') !== -1 ||
          str.indexOf('failed to connect') !== -1
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (event) {
        var str = event && event.message ? String(event.message) : '';
        if (
          str.indexOf('WebSocket') !== -1 ||
          str.indexOf('websocket') !== -1 ||
          str.indexOf('closed without opened') !== -1
        ) {
          event.preventDefault();
          if (event.stopImmediatePropagation) event.stopImmediatePropagation();
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
