name: Apply Gemini market-context fix

on:
  push:
    paths:
      - '.github/workflows/ai-context-fix.yml'

permissions:
  contents: write

jobs:
  fix-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply full-file migration
        run: node scripts/applyGeminiContextFix.mjs

      - name: TypeScript verification
        run: npm run lint

      - name: Production build verification
        run: npm run build

      - name: Commit verified replacement and remove migration files
        run: |
          rm -f scripts/applyGeminiContextFix.mjs .github/workflows/ai-context-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/geminiTrader.ts scripts/applyGeminiContextFix.mjs .github/workflows/ai-context-fix.yml
          git commit -m "fix: let Gemini discover setups from full market context"
          git push origin HEAD:main
